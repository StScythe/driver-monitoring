[project]
name = "driver-monitoring"
version = "2.0.0"
description = "Driver Monitoring System - Real-time fatigue and distraction detection"
authors = [
    {name = "Volkov D.V."},
    {name = "Volkova N.V."}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy==2.2.6",
    "opencv-python==4.12.0.88",
    "mediapipe==0.10.14",
    "pandas==2.3.3",
    "matplotlib==3.10.7",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project.scripts]
dms = "scripts.run:main"

[tool.setuptools.packages.find]
where = ["src"]